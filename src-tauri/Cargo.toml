[package]
name = "acta-handy"
version = "0.10.0"
description = "Acta Handy · 行记便易"
authors = ["MogroWang Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "acta_handy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

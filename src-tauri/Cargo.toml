[package]
name = "acta-handy"
version = "1.1.0-beta2"
description = "Acta Handy · 行记便易"
authors = ["MogroWang Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "acta_handy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# 应用内更新：查 Release、下载更新包、两路测速。
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 测速探针的「块间空闲」计时（tokio::time::timeout）需要 time 能力；
# tokio 本体已随 tauri/reqwest 引入，这里只是显式声明使用到的 feature。
tokio = { version = "1", default-features = false, features = ["time"] }
# 更新包是 zip 压缩包（ActaHandy-<版本>-<平台>-<架构>.zip），安装时解出其中的
# ActaHandy.exe / *.dmg；只用 deflate，不带多余格式支持。
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

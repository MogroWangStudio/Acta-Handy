<svg xmlns="http://www.w3.org/2000/svg" width="364" height="664" viewBox="0 0 91 166">
  <!-- macOS 顶栏（菜单栏）托盘图标源文件：Handy 剪影，黑色 + alpha。
       用 Edge/Chromium 无头截图渲染为 PNG（窗口 364x664、背景透明，
       命令为 headless 模式的 screenshot 参数加 default-background-color
       的全零色值），再由 Rust 端以 icon_as_template(true) 交给系统：
       菜单栏按深浅外观自动把剪影染成白色或黑色，无需为两种模式各出
       一张图。图形与 HandyChar.vue 完全同源（同样的变换链与路径），
       仅眼睛为镂空并适当放大（r=9，原 9.283），18pt 高度下仍能读出
       两只眼。 -->
  <defs>
    <mask id="eye-holes">
      <rect x="0" y="0" width="91" height="166" fill="#ffffff"/>
      <g transform="matrix(1,0,0,1,-472.860418,-756.917314)">
        <circle cx="622.755" cy="911.802" r="9" transform="matrix(0.343585,0,0,0.343585,294.880491,522.736671)" fill="#000000"/>
        <circle cx="622.755" cy="911.802" r="9" transform="matrix(0.343585,0,0,0.343585,313.556419,522.736671)" fill="#000000"/>
      </g>
    </mask>
  </defs>

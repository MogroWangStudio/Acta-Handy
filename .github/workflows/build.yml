name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# 每次推送到 main 都会自动构建两平台产物（CI）：构建结果以 artifact 形式
# 上传，名字带 run number 保证唯一（upload-artifact v4 不允许同名重复）。
# 推送 v* 标签时走同一条流水线，产物保持正式命名并附加到 GitHub Release。

jobs:
  windows-portable:
    name: Windows x64 portable exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build portable exe
        run: npm run windows:portable
      - name: Collect portable exe
        id: collect
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release" -Filter *.exe |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No portable exe found in release output." }
          # CI 构建的产物名带 run number；标签发布保持正式命名。
          $suffix = if ($env:GITHUB_REF_TYPE -eq "tag") { "" } else { "-ci-$($env:GITHUB_RUN_NUMBER)" }
          $name = "ActaHandy-$($env:VERSION)-windows-x64-portable$suffix"
          Copy-Item $exe.FullName "dist/$name.exe"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: dist/*.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ActaHandy-*-windows-x64-portable.exe

  macos-arm64:
    name: macOS arm64 dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build dmg
        run: npm run macos:build
      - name: Collect dmg
        id: collect
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -z "$dmg" ]; then
            echo "No dmg found in bundle output." >&2
            exit 1
          fi
          # CI 构建的产物名带 run number；标签发布保持正式命名。
          suffix=""
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            suffix="-ci-$GITHUB_RUN_NUMBER"
          fi
          name="ActaHandy-${VERSION}-macos-arm64${suffix}"
          cp "$dmg" "dist/$name.dmg"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: dist/*.dmg
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ActaHandy-*-macos-arm64.dmg

# 按需的构建验证：手动触发，只确认当前分支能产出三份平台压缩包，产物留在
# Actions 的 Artifacts 里——不发 Release、不打 tag、不写版本号。
#
# 推送 main 后自动发版由 release.yml 负责（读 tauri.conf.json 的版本号决定
# 正式版 / Pre-Release）。原先「推送到 main 就自动构建」的触发已移除，避免与
# release.yml 重复跑一遍同样的三份构建。

name: Build

on:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build portable exe
        run: npm run windows:portable
      - name: Collect exe into zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # 与 release.yml 同构的产物：ActaHandy-<版本>-windows-x64.zip，包内单个 ActaHandy.exe。
          New-Item -ItemType Directory -Force -Path dist/payload | Out-Null
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release" -Filter *.exe |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No portable exe found in release output." }
          Copy-Item $exe.FullName "dist/payload/ActaHandy.exe"
          Compress-Archive -Path "dist/payload/ActaHandy.exe" `
            -DestinationPath "dist/ActaHandy-$($env:VERSION)-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ActaHandy-${{ steps.ver.outputs.version }}-windows-x64
          path: dist/ActaHandy-*-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} dmg
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build app bundle
        run: npx tauri build --bundles app --target ${{ matrix.target }}
      - name: Strip quarantine from app bundle
        shell: bash
        run: |
          app_path=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -n 1)
          sudo xattr -r -d com.apple.quarantine "$app_path" 2>/dev/null || true
      - name: Package dmg with unlock script
        shell: bash
        run: bash scripts/dmg/package-dmg.sh "${{ steps.ver.outputs.version }}" "${{ matrix.arch }}"
      - name: Collect dmg into zip
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          # 与 release.yml 同构的产物：ActaHandy-<版本>-macos-<架构>.zip，包内单个 dmg。
          cd dist
          dmg="ActaHandy-${VERSION}-macos-${ARCH}.dmg"
          zip -q "ActaHandy-${VERSION}-macos-${ARCH}.zip" "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ActaHandy-${{ steps.ver.outputs.version }}-macos-${{ matrix.arch }}
          path: dist/ActaHandy-*-macos-*.zip
          if-no-files-found: error

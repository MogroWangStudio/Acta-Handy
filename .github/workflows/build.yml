name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows x64 portable exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Build portable exe
        run: npm run windows:portable
      - name: Collect portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release" -Filter *.exe |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No portable exe found in release output." }
          Copy-Item $exe.FullName "dist/ActaHandy-${{ steps.ver.outputs.version }}-windows-x64-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ActaHandy-${{ steps.ver.outputs.version }}-windows-x64-portable
          path: dist/ActaHandy-*-windows-x64-portable.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ActaHandy-*-windows-x64-portable.exe

  macos-arm64:
    name: macOS arm64 dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Build dmg
        run: npm run macos:build
      - name: Collect dmg
        shell: bash
        run: |
          mkdir -p dist
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -z "$dmg" ]; then
            echo "No dmg found in bundle output." >&2
            exit 1
          fi
          cp "$dmg" "dist/ActaHandy-${{ steps.ver.outputs.version }}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ActaHandy-${{ steps.ver.outputs.version }}-macos-arm64
          path: dist/ActaHandy-*-macos-arm64.dmg
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ActaHandy-*-macos-arm64.dmg
